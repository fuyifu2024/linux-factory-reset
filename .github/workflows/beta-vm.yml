name: Beta actual VM acceptance
run-name: 'Beta ${{ inputs.distro }} ${{ inputs.arch }} / ${{ inputs.fault }}'
on:
  workflow_dispatch:
    inputs:
      distro:
        type: choice
        options: [ubuntu, fedora]
        default: ubuntu
      arch:
        type: choice
        options: [arm64, amd64]
        default: arm64
      fault:
        type: choice
        options: [none, failure, powercut]
        default: none
      cycles:
        type: choice
        options: ['2', '1']
        default: '2'
      gui:
        description: Real Zenity and polkit acceptance (Ubuntu AMD64)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  vm:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Disposable runner dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev nlohmann-json3-dev qemu-utils qemu-system-x86 qemu-system-arm qemu-efi-aarch64 ovmf gdisk parted nodejs rsync squashfs-tools btrfs-progs dosfstools
      - run: cmake -S . -B build -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr && cmake --build build -j2
      - name: Build native guest package
        env:
          DISTRO: ${{ inputs.distro }}
        run: |
          if [ "$DISTRO" = fedora ]; then
            docker run --rm -v "$PWD:/src" -w /src fedora:45 bash -ec '
              dnf install -y gcc-c++ cmake openssl-devel libcurl-devel json-devel rpm-build file rsync squashfs-tools
              cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build build-native -j2
              ctest --test-dir build-native --output-on-failure
              cd build-native; cpack -G RPM'
          else
            docker run --rm -v "$PWD:/src" -w /src ubuntu:26.04 bash -ec '
              apt-get update
              apt-get install -y build-essential cmake libssl-dev libcurl4-openssl-dev nlohmann-json3-dev file rsync squashfs-tools
              cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build build-native -j2
              ctest --test-dir build-native --output-on-failure
              cd build-native; cpack -G DEB'
          fi
      - name: Start actual disposable VM acceptance
        run: |
          mkdir -p evidence
          nohup sudo env GITHUB_ACTIONS=true SOURCE_ARCH='${{ inputs.arch }}' RESET_CYCLES='${{ inputs.cycles }}' GUI_ACCEPTANCE='${{ inputs.gui && 'yes' || 'no' }}' VM_TIMEOUT_MINUTES=150 bash -c '
            bash tests/engine-image.sh "$1" "$2"
            echo "$?" > evidence/test-exit
          ' bash '${{ inputs.distro }}' '${{ inputs.fault }}' > evidence/host.txt 2>&1 < /dev/null &
      - name: First running checkpoint
        run: for i in $(seq 1 18); do test ! -f evidence/test-exit || break; sleep 10; done
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: progress-1-${{ inputs.distro }}-${{ inputs.arch }}-${{ inputs.fault }}
          path: evidence/
      - name: Second running checkpoint
        run: for i in $(seq 1 18); do test ! -f evidence/test-exit || break; sleep 10; done
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: progress-2-${{ inputs.distro }}-${{ inputs.arch }}-${{ inputs.fault }}
          path: evidence/
      - name: Restoration checkpoint
        run: for i in $(seq 1 30); do test ! -f evidence/test-exit || break; sleep 10; done
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: progress-3-${{ inputs.distro }}-${{ inputs.arch }}-${{ inputs.fault }}
          path: evidence/
      - name: Await and verify actual VM result
        run: |
          for i in $(seq 1 900); do
            if test -f evidence/test-exit; then
              tail -40 evidence/host.txt
              test "$(cat evidence/test-exit)" = 0
              exit "$?"
            fi
            sleep 10
          done
          echo 'Acceptance did not complete; inspect running checkpoints and final evidence.'
          exit 1
      - name: Make disposable QA evidence readable for upload
        if: always()
        run: sudo chmod -R a+rX evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-${{ inputs.distro }}-${{ inputs.arch }}-${{ inputs.fault }}
          path: evidence/
