name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        os:
          - {image: "ubuntu:24.04", label: "ubuntu24.04"}
          - {image: "debian:bookworm-slim", label: "debian12"}
          - {image: "debian:trixie-slim", label: "debian13"}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.os.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build and fixture-test dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git build-essential cmake file libssl-dev libcurl4-openssl-dev nlohmann-json3-dev rsync squashfs-tools shellcheck
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build -j2
      - name: Tests (temporary directories only)
        run: ctest --test-dir build --output-on-failure
      - name: Real HTTPS download and cancellation in disposable container
        run: sh tests/https.sh "$PWD/build/test-download"
      - name: Shell validation
        run: shellcheck -e SC1091 boot/hook boot/local-bottom boot/reconcile.sh boot/relocate.sh firstboot/firstboot.sh tests/reconcile.sh tests/relocate.sh tests/https.sh tests/gui-flow.sh
      - name: Package
        run: cd build && cpack -G DEB
      - name: Install package in disposable container (never arm reset)
        run: |
          apt-get install -y --no-install-recommends ./build/*.deb
          linux-factory-reset --version
          ubuntu-reset --version
          linux-factory-reset status
          test ! -e /var/lib/ubuntu-reset/request
          test ! -e /etc/ubuntu-reset/boot.conf
          test -f /usr/lib/ubuntu-reset/relocate.sh
      - name: Start GUI without GPU in disposable container
        run: |
          apt-get install -y --no-install-recommends xvfb xauth
          useradd --create-home gui-smoke
          set +e
          runuser -u gui-smoke -- env -u GSK_RENDERER -u LIBGL_ALWAYS_SOFTWARE xvfb-run -a timeout --kill-after=2 5 linux-factory-reset gui > /tmp/gui-smoke.log 2>&1
          TASK_STATUS=$?
          set -e
          cat /tmp/gui-smoke.log
          test "$TASK_STATUS" -eq 124
          if grep -E 'MESA: error|ZINK:|libEGL warning|failed to create dri2' /tmp/gui-smoke.log; then exit 1; fi
      - name: Drive missing-state GUI flow without privileged actions
        run: sh tests/gui-flow.sh /usr/bin/linux-factory-reset
      - name: Collect distro-specific binary and package
        env:
          TASK_DISTRO: ${{ matrix.os.label }}
        run: |
          TASK_ARCH=$(dpkg --print-architecture)
          mkdir -p build/release
          cp build/*.deb "build/release/linux-factory-reset_0.3.0-alpha.1_${TASK_DISTRO}_${TASK_ARCH}.deb"
          cp build/linux-factory-reset "build/release/linux-factory-reset-${TASK_DISTRO}-linux-${TASK_ARCH}"
          strip "build/release/linux-factory-reset-${TASK_DISTRO}-linux-${TASK_ARCH}"
          cd build/release
          sha256sum *.deb linux-factory-reset-*-linux-* > "SHA256SUMS-${TASK_DISTRO}-${TASK_ARCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-factory-reset-${{ matrix.os.label }}-${{ matrix.runner }}
          path: build/release/*
